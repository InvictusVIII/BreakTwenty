name: Release Health

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-health:
    name: Release health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run release health
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASELINE="${BASE_SHA:-HEAD}"
          python scripts/check_public_tree.py --candidate HEAD --baseline-ref "$BASELINE" --check-worktree
          python scripts/run_release_health.py
